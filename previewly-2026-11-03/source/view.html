<!doctype html>
<html lang="en" data-theme="light">
<head>
<!-- @head -->
<link rel="stylesheet" href="/src/mockups/mockups.css">
<title>Open shared document — Previewly</title>
<meta name="description" content="Open a preview someone shared with you: paste its link, enter its passcode.">
</head>
<body class="app">
<!-- @header -->
<!-- one page, four states: paste a link (no ?t=), the passcode, the link gone (expired or unknown), the document -->
<main id="main" class="page narrow">
  <section class="panel" id="paste" hidden>
    <h1>Open shared document</h1>
    <p class="lead">Paste the link the sender gave you.</p>
    <form id="pasteForm" novalidate>
      <div class="field">
        <label class="label" for="linkIn">Shared link</label>
        <input class="input" id="linkIn" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://previewly.cc/view/…" aria-describedby="pasteErr">
      </div>
      <div class="alert" id="pasteErr" role="alert" hidden><i aria-hidden="true">!</i><span></span></div>
      <div class="actions"><button class="cta lg" type="submit" id="pasteGo" disabled>Continue</button></div>
    </form>
  </section>

  <section class="panel" id="lock" hidden>
    <h1>Open shared document</h1>
    <p class="lead">This document is protected. Enter the passcode the sender gave you.</p>
    <p class="value" id="lockExp" hidden></p>
    <form id="lockForm" novalidate>
      <div class="field">
        <label class="label" for="code">Passcode</label>
        <div class="inputwrap">
          <input class="input code-in" id="code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="lockErr">
          <button type="button" class="reveal" data-reveal="code" aria-label="Show" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
        </div>
      </div>
      <div class="alert" id="lockErr" role="alert" hidden><i aria-hidden="true">!</i><span>Something went wrong. Please try again.</span></div>
      <div class="actions"><button class="cta lg" type="submit" id="lockGo" disabled>View document</button></div>
    </form>
  </section>

  <section class="panel" id="gone" hidden>
    <span class="okbadge off" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
    <h1 id="goneTitle"></h1>
    <p class="lead" id="goneLead"></p>
    <div class="actions"><a class="btn" href="view.html">Open another link</a></div>
  </section>

  <section id="doc" hidden>
    <a class="backlink" id="back" href="previews.html" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg>My previews</a>
    <h1 tabindex="-1">Open shared document</h1>
    <div class="doctools">
      <span class="fileic" id="docIc" aria-hidden="true"></span>
      <div class="docname"><b id="docName"></b><span id="docMeta"></span></div>
      <div class="seg" id="zoom" role="group" aria-label="Zoom">
        <button type="button" data-zoom="fit" aria-pressed="true">Fit</button><button type="button" data-zoom="1" aria-pressed="false">100%</button>
      </div>
    </div>
    <p class="ownnote" id="ownNote" hidden></p>
    <div class="viewer" id="viewer" tabindex="0" aria-label="The shared document"></div>
  </section>
</main>
<script type="module" src="/src/app/view.js"></script>
</body>
</html>
