<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- the theme before first paint: the visitor's choice, else the system's (as on the landing page) -->
<script>(function(){var t;try{t=localStorage.getItem('previewly-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
<link rel="preload" href="./assets/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232B6CF6'/%3E%3Ccircle cx='23' cy='9' r='3.5' fill='white'/%3E%3C/svg%3E">
<title>Log in — Previewly</title>
<meta name="description" content="Log in to upload and manage your previews.">
  <script type="module" crossorigin src="./assets/login.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/theme.js">
  <link rel="modulepreload" crossorigin href="./assets/store.js">
  <link rel="stylesheet" crossorigin href="./assets/base.css">
  <link rel="stylesheet" crossorigin href="./assets/app.css">
</head>
<body class="app">
<a class="skip" href="#main">Skip to content</a>
<header class="top app">
  <a class="brand" href="index.html" aria-label="Previewly, home"><span class="mark" aria-hidden="true"></span><span>Previewly</span></a>
  <nav class="tools" aria-label="Main">
    <button type="button" class="iconbtn" id="theme" aria-label="Dark theme" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></g><path class="moon" d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>
    </button>
    <a class="navlink" href="previews.html" data-nav="previews" aria-label="My previews">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 13.5h8M8 16.5h5"/></svg><span>My previews</span>
    </a>
    <a class="btn" href="view.html" data-nav="view">View</a>
    <a class="cta" href="upload.html" data-nav="upload"><span>Upload<span class="wide-only"> ZIP</span></span></a>
  </nav>
</header>
<main id="main" class="page center">
  <section class="panel login">
    <h1>Log in</h1>
    <p class="lead">Welcome back. Enter your details to continue.</p>
    <form id="form" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com" aria-describedby="emailErr">
        <p class="ferr" id="emailErr" hidden></p>
      </div>
      <div class="field">
        <label class="label" for="pw">Password</label>
        <div class="inputwrap">
          <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="pwErr">
          <button type="button" class="reveal" data-reveal="pw" aria-label="Show" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
        </div>
        <p class="ferr" id="pwErr" hidden></p>
      </div>
      <div class="row between">
        <label class="check"><input type="checkbox" id="keep"><span>Remember me</span></label>
        <a href="#" class="textlink" data-todo="Resetting a password isn’t part of this prototype.">Forgot password?</a>
      </div>
      <button class="cta lg block" type="submit" id="submit">Log in</button>
    </form>
    <hr class="rule">
    <p class="foot">Don’t have an account? <a href="#" class="textlink" data-todo="Signing up isn’t part of this prototype.">Sign up</a></p>
  </section>
  <p class="proto">A prototype: any email and password sign you in, on this browser only.</p>
</main>
</body>
</html>
